    unit: m
    source: S2-00 contract
    rationale: Provisional width, disabled in Stage 2.
  door_disabled_in_stage2:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: No doorway is generated for S2-00.
  box_length_xO:
    status: FROZEN
    value: 1.20
    unit: m
    source: S2-00 contract
    rationale: Long axis of the rigid box.
  box_width_yO:
    status: FROZEN
    value: 0.60
    unit: m
    source: S2-00 contract
    rationale: Short axis of the rigid box.
  box_height_zO:
    status: FROZEN
    value: 1.20
    unit: m
    source: S2-00 contract
    rationale: Vertical box dimension.
  box_half_length_xO:
    status: FROZEN
    value: 0.60
    unit: m
    source: Derived from box_length_xO
    rationale: Rear face is at negative half length.
  box_half_width_yO:
    status: FROZEN
    value: 0.30
    unit: m
    source: Derived from box_width_yO
    rationale: Lateral half extent.
  box_half_height_zO:
    status: FROZEN
    value: 0.60
    unit: m
    source: Derived from box_height_zO
    rationale: Vertical half extent; not a CoM assumption.
  rear_surface_xO:
    status: FROZEN
    value: -0.60
    unit: m
    source: S2-00 contract
    rationale: Rear surface of the box.
  rear_inward_normal_xO:
    status: FROZEN
    value: 1.0
    unit: dimensionless
    source: S2-00 contract
    rationale: Inward surface normal points along positive xO.
  rear_tangent_axis:
    status: FROZEN
    value: yO
    unit: axis
    source: S2-00 contract
    rationale: Bilateral contacts mirror across yO=0.
  xO_axis:
    status: FROZEN
    value: long_box_axis
    unit: axis
    source: S2-00 contract
    rationale: xO follows the 1.20 m edge.
  yO_axis:
    status: FROZEN
    value: short_box_axis
    unit: axis
    source: S2-00 contract
    rationale: yO follows the 0.60 m edge.
  zO_axis:
    status: FROZEN
    value: vertical_up
    unit: axis
    source: S2-00 contract
    rationale: zO is vertical.

