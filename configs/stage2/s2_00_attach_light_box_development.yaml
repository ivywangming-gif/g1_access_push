    status: FROZEN
    value: rear_centered_bilateral
    unit: identifier
    source: S2-00 contract
    rationale: Only the centered bilateral rear template is described.
  surface:
    status: FROZEN
    value: rear
    unit: identifier
    source: S2-00 contract
    rationale: Contacts are on the rear surface.
  bilateral:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Both palms are required.
  mirrored_about_yO_zero:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Left/right tangential coordinates are mirrored.
  equal_contact_height:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Both contact heights are constrained equal, without choosing a value.
  palm_normals_plus_xO:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Both palm normals point inward along +xO.
  precontact_outside_rear:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Precontact is outside the rear surface.
  approach_along_normal_only:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Approach has no tangential motion.
  palm_orientation_fixed_during_approach:
    status: FROZEN
    value: true
    unit: dimensionless
    source: S2-00 contract
    rationale: Orientation is held during the normal approach.
  allowed_contact_semantics:
    status: FROZEN
    value: [left_palm_allowed_patch, right_palm_allowed_patch]
    unit: semantic_categories
    source: S2-00 contract
    rationale: Only the two palm patches are allowed to contact the box.
  forbidden_contact_semantics:
    status: FROZEN
    value: [forearm, upper_arm, shoulder, chest_torso, pelvis, thigh, shank, foot, head, other_non_palm_link]
    unit: semantic_categories
    source: S2-00 contract
    rationale: Any non-palm body contact is forbidden; link-name mapping remains asset-dependent.
  contact_height:
    status: UNRESOLVED
    value: UNRESOLVED
    unit: m
    source: UNRESOLVED
    rationale: Must not default to geometric center height.
  tangential_separation:
    status: UNRESOLVED
    value: UNRESOLVED
    unit: m
    source: UNRESOLVED
    rationale: Must be calibrated or sourced before execution.
  nominal_base_to_box_distance:
    status: UNRESOLVED
    value: UNRESOLVED
    unit: m
    source: UNRESOLVED
